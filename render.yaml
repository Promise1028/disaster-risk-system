services:
  - type: web
    name: disaster-risk-system
    env: python
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python seed_data.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./disaster_risk.db
      - key: SECRET_KEY
        generateValue: true
